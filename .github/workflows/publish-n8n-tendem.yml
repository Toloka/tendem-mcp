name: Publish n8n-nodes-tendem to npm

# Release flow: bump `version` in integrations/n8n-nodes-tendem/package.json on
# main (and keep MCP_CLIENT_VERSION in transport.ts in sync — a test enforces
# it), then push a matching tag:
#
#   git tag n8n-nodes-tendem-v0.1.0 && git push origin n8n-nodes-tendem-v0.1.0
#
# The job refuses to publish when the tag and package version disagree.
#
# Publishing uses npm trusted publishing (OIDC) — no token, no secret. The
# trusted publisher is configured in the package's settings on npmjs.com
# (org Toloka, repo tendem-mcp, this workflow file). `id-token: write` is what
# lets the job mint the OIDC token and attach the provenance attestation n8n's
# verification guidelines require (mandatory since May 2026); publishing from
# a laptop disqualifies the release from verification. 0.1.0 was bootstrapped
# with a one-shot token (OIDC cannot first-publish a nonexistent package);
# that token is revoked.

on:
  push:
    tags:
      - "n8n-nodes-tendem-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/n8n-nodes-tendem
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # engines.node is >=20.19 (the floor @n8n/node-cli can run on); 22 is
          # the current LTS above it. No registry-url: with trusted publishing
          # there is no NODE_AUTH_TOKEN, and setup-node's .npmrc template would
          # fail on the unset variable.
          node-version: 22

      - name: Update npm (OIDC trusted publishing needs >= 11.5.1)
        run: npm install -g npm@latest && npm --version

      - name: Install
        # --ignore-scripts skips native builds. The dev tree transitively pulls
        # isolated-vm (via @n8n/node-cli -> @n8n/expression-runtime), whose C++
        # compile is fragile across Node/compiler versions — and nothing lint or
        # the tests run actually loads it. Verified: 85/85 tests and a clean
        # lint against an --ignore-scripts install.
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Verify the tag matches the package version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#n8n-nodes-tendem-v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          echo "tag=$TAG_VERSION package=$PKG_VERSION"
          test "$TAG_VERSION" = "$PKG_VERSION"

      - name: Inspect the tarball
        run: npm pack --dry-run

      - name: Publish
        # Auth comes from the OIDC exchange (trusted publisher + id-token:
        # write); provenance is generated as part of the same flow.
        run: npm publish --provenance --access public
